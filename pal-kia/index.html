<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PokePalma</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header>
        <nav class="nav">

            <img src="./img/pokedex.png" alt="Logo de la Pokédex">

            <div class="buscador">
                <label for="buscador-pokemon">Buscar Pokémon</label>

                <div class="buscador-contenedor">
                    <input
                        type="text"
                        id="buscador-pokemon"
                        placeholder="Buscar por nombre..."
                    >

                    <button id="btn-buscar" class="btn-buscar">
                        Buscar
                    </button>
                </div>
            </div>

            <ul class="nav-list">

                <li class="nav-item">
                    <button class="btn btn-header" id="ver-todos">
                        Ver todos
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header normal" id="normal">
                        Normal
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header fire" id="fire">
                        Fire
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header water" id="water">
                        Water
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header grass" id="grass">
                        Grass
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header electric" id="electric">
                        Electric
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header ice" id="ice">
                        Ice
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header fighting" id="fighting">
                        Fighting
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header poison" id="poison">
                        Poison
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header ground" id="ground">
                        Ground
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header flying" id="flying">
                        Flying
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header psychic" id="psychic">
                        Psychic
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header bug" id="bug">
                        Bug
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header rock" id="rock">
                        Rock
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header ghost" id="ghost">
                        Ghost
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header dark" id="dark">
                        Dark
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header dragon" id="dragon">
                        Dragon
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header steel" id="steel">
                        Steel
                    </button>
                </li>

                <li class="nav-item">
                    <button class="btn btn-header fairy" id="fairy">
                        Fairy
                    </button>
                </li>

            </ul>

        </nav>
    </header>

    <main>


        <div id="mensaje-estado" class="mensaje-estado"></div>


        <section class="equipo-seccion">

            <div class="equipo-titulo">
                <h1>Mi Equipo</h1>
                <span id="contador-equipo">0 / 6</span>
            </div>

            <div id="mi-equipo" class="mi-equipo">
                <p class="equipo-vacio">
                    Todavía no agregaste ningún Pokémon.
                </p>
            </div>

        </section>


        <section>

            <div class="pokemon-todos" id="lista-pokemon"></div>

            <div class="cargar-mas-contenedor">
                <button id="cargar-mas" class="btn-cargar">
                    Cargar más
                </button>
            </div>

        </section>

    </main>


    <div id="modal" class="modal">

        <div class="modal-contenido">

            <button id="cerrar-modal" class="cerrar-modal">
                ×
            </button>

            <div id="detalle-pokemon"></div>

        </div>

    </div>

    <script src="./js/api.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/main.js"></script>

</body>
</html>
